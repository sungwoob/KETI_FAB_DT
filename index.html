<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FAB 장비 3D 모델 뷰어</title>
  <style>
    :root {
      color-scheme: light dark;
    }

    body {
      margin: 0;
      font-family: "Inter", "Noto Sans KR", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 16px 20px;
      background: linear-gradient(90deg, #0b1021 0%, #111827 100%);
      border-bottom: 1px solid #1e293b;
      box-shadow: 0 1px 6px rgba(0, 0, 0, 0.35);
      position: relative;
      z-index: 2;
    }

    h1 {
      margin: 0;
      font-size: 1.25rem;
      letter-spacing: 0.02em;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    h1 span {
      display: inline-flex;
      padding: 6px 10px;
      border-radius: 8px;
      background: rgba(59, 130, 246, 0.12);
      color: #bfdbfe;
      font-weight: 600;
      font-size: 0.95rem;
      border: 1px solid rgba(59, 130, 246, 0.35);
    }

    #viewer {
      position: relative;
      flex: 1;
      overflow: hidden;
    }

    #canvas-container {
      width: 100%;
      height: 100%;
    }

    #legend {
      position: absolute;
      right: 20px;
      top: 20px;
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.82);
      border: 1px solid rgba(148, 163, 184, 0.2);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(6px);
      max-width: 320px;
      line-height: 1.45;
      font-size: 0.9rem;
      color: #cbd5e1;
    }

    #legend h2 {
      margin: 0 0 8px;
      font-size: 1rem;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #legend ul {
      margin: 0;
      padding-left: 18px;
    }

    #legend li + li {
      margin-top: 4px;
    }

    a {
      color: #93c5fd;
    }
  </style>
</head>
<body>
  <header>
    <h1>
      FAB 장비 3D 모델 뷰어
      <span>FBX × 2</span>
    </h1>
  </header>
  <section id="viewer">
    <div id="canvas-container"></div>
    <aside id="legend">
      <h2>조작 방법</h2>
      <ul>
        <li>드래그: 모델 회전</li>
        <li>휠/핀치: 확대 · 축소</li>
        <li>Shift + 드래그: 이동(Pan)</li>
      </ul>
      <p style="margin-top:10px;">모델 파일: <code>ThinFilmDepositionSystem_01.fbx</code>, <code>ThinFilmDepositionSystem_02.fbx</code></p>
    </aside>
  </section>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.161.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.161.0/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import {
      AmbientLight,
      Box3,
      Color,
      DirectionalLight,
      GridHelper,
      PerspectiveCamera,
      Scene,
      Vector3,
      WebGLRenderer
    } from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { FBXLoader } from "three/addons/loaders/FBXLoader.js";

    const container = document.getElementById("canvas-container");
    const scene = new Scene();
    scene.background = new Color("#0b1224");

    const camera = new PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 5000);
    camera.position.set(0, 220, 520);

    const renderer = new WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 80, 0);
    controls.enableDamping = true;

    const ambient = new AmbientLight(0xcad4e0, 0.6);
    scene.add(ambient);

    const directional = new DirectionalLight(0xffffff, 1.1);
    directional.position.set(300, 500, 400);
    directional.castShadow = true;
    directional.shadow.mapSize.set(2048, 2048);
    scene.add(directional);

    const grid = new GridHelper(1000, 20, 0x3b82f6, 0x1f2937);
    scene.add(grid);

    const loader = new FBXLoader();

    function placeModel(object, offsetX) {
      object.rotation.x = -Math.PI / 2;

      object.traverse((child) => {
        if (child.isMesh) {
          child.castShadow = true;
          child.receiveShadow = true;
        }
      });

      const box = new Box3().setFromObject(object);
      const size = new Vector3();
      box.getSize(size);

      const targetSize = 280;
      const maxDim = Math.max(size.x, size.y, size.z);
      const scale = maxDim > 0 ? targetSize / maxDim : 1;
      object.scale.setScalar(scale);

      const centeredBox = new Box3().setFromObject(object);
      const center = new Vector3();
      centeredBox.getCenter(center);
      object.position.sub(center);

      const groundedBox = new Box3().setFromObject(object);
      const minY = groundedBox.min.y;
      object.position.y -= minY;
      object.position.x += offsetX;

      scene.add(object);
    }

    function loadFBX(path, offsetX) {
      loader.load(
        path,
        (object) => {
          placeModel(object, offsetX);
        },
        undefined,
        (error) => {
          console.error(`Failed to load ${path}:`, error);
        }
      );
    }

    loadFBX("./3D_model/ThinFilmDepositionSystem_01.fbx", -240);
    loadFBX("./3D_model/ThinFilmDepositionSystem_02.fbx", 240);

    function onResize() {
      const { innerWidth, innerHeight } = window;
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    }

    window.addEventListener("resize", onResize);

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
